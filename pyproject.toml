[build-system]
requires = ["setuptools>=77", "wheel"]   # 77: SPDX license string
build-backend = "setuptools.build_meta"

[project]
name = "obstacle-builder"
version = "0.1.0"
description = "Generate 3D obstacle models from OptiTrack rigid bodies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "PyQt6>6.6",
    "PyOpenGL>=3.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "numpy-stl>=3.0",
    "platformdirs>=4.0",
    "python-fcl>=0.7",
    "octomap-python>=1.10",
]

[project.optional-dependencies]
ompl = ["ompl>=2.0"]   # examples/ompl_planning.py — Linux / macOS only (no Windows wheels)
dev = ["pytest>=7", "ruff==0.17.4", "mujoco>=3.2"]   # mujoco: tests of the MuJoCo adapter

[project.scripts]
obstacle-builder = "obstacle_builder.gui.main_window:main"
obstacle-builder-gazebo = "obstacle_builder.adapters.gazebo:main"
obstacle-builder-octomap = "obstacle_builder.adapters.octomap:main"
obstacle-builder-ros2 = "obstacle_builder.adapters.ros2:main"
obstacle-builder-mujoco = "obstacle_builder.adapters.mujoco:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obstacle_builder = ["gui/resources/*.png"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored OptiTrack NatNet SDK sample code - kept as shipped, not linted.
extend-exclude = [
    "src/obstacle_builder/natnet/DataDescriptions.py",
    "src/obstacle_builder/natnet/MoCapData.py",
    "src/obstacle_builder/natnet/NatNetClient.py",
    "src/obstacle_builder/natnet/PythonSample.py",
]